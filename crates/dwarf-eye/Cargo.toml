[package]
name = "dwarf-eye"
description = "A voxel view of a live Dwarf Fortress map"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bevy = "0.19.1"
bytemuck = { version = "1", features = ["derive"] }
dfhack-remote = { path = "../dfhack-remote" }
dwarf-eye-art = { path = "../dwarf-eye-art" }
dwarf-eye-world = { path = "../dwarf-eye-world" }
dwarf-eye-trees = { path = "../dwarf-eye-trees" }

[[bin]]
name = "dwarf-eye"
path = "src/main.rs"

# A bench for the tree generator, with no Dwarf Fortress connection.
[[bin]]
name = "tree-lab"
path = "src/bin/tree-lab.rs"

# A bench for GPU instancing, with no Dwarf Fortress connection.
[[bin]]
name = "instance-lab"
path = "src/bin/instance-lab.rs"
