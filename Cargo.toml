[workspace]
resolver = "3"
members = ["crates/dfhack-remote", "crates/dwarf-eye-world", "crates/dwarf-eye", "crates/dwarf-eye-art"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
prost = "0.14.4"
prost-build = "0.14.4"

# Bevy is unusable at debug opt levels, so always optimise dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
